<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerFlow — Smart Business & Expense Manager</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- jsPDF & AutoTable Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --success: #10b981;
            --success-light: #ecfdf5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 30px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Authentication Screen Styles */
        .auth-container {
            max-width: 400px;
            margin: 60px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-header h2 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px 24px;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            outline: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.5);
            padding-bottom: 2px;
            cursor: pointer;
        }

        header h1:focus {
            border-bottom: 2px solid #ffffff;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .card h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card .amount {
            font-size: 26px;
            font-weight: 700;
        }

        .text-red { color: var(--danger); }
        .text-green { color: var(--success); }

        .main-content {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .panel h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-gave { background-color: var(--danger); flex: 1; }
        .btn-gave:hover { background-color: #dc2626; }

        .btn-got { background-color: var(--success); flex: 1; }
        .btn-got:hover { background-color: #059669; }

        .btn-primary { background-color: var(--primary); width: 100%; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-export { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); width: 100%; margin-top: 15px; }
        .btn-export:hover { background-color: #e2e8f0; }

        .customer-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .customer-item {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .customer-item:hover {
            background-color: #f1f5f9;
        }

        .customer-item.active {
            background-color: #e0e7ff;
            border-color: #c7d2fe;
            font-weight: 600;
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 6px;
            text-transform: uppercase;
        }
        .badge-cust { background: #dbeafe; color: #1e40af; }
        .badge-event { background: #fef3c7; color: #92400e; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .delete-btn {
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 600;
            font-size: 12px;
            transition: color 0.2s ease;
        }

        .delete-btn:hover { color: var(--danger); }

        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .btn-pdf {
            background-color: var(--primary);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION CONTAINER (LOGIN / REGISTER) -->
    <div id="auth-section" class="auth-container">
        <div class="auth-header">
            <h2>⚡ LedgerFlow</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Manage your accounts securely</p>
        </div>

        <div class="auth-tabs">
            <div id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
            <div id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
            <div class="form-group">
                <label for="reg-username">Choose Username</label>
                <input type="text" id="reg-username" required placeholder="Create a username">
            </div>
            <div class="form-group">
                <label for="reg-password">Choose Password</label>
                <input type="password" id="reg-password" required placeholder="Create a password">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Create Account</button>
        </form>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-section" style="display: none;">
        
        <header>
            <h1 id="app-title" contenteditable="true" onblur="saveTitle()" title="Click to edit title">⚡ LedgerFlow</h1>
            <div class="user-info">
                <span>Logged in as: <strong id="logged-user-name">User</strong></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- Top Dashboard Summary -->
        <div class="dashboard">
            <div class="card">
                <h3>Total You Will Get</h3>
                <div id="total-get" class="amount text-green">₹0</div>
            </div>
            <div class="card">
                <h3>Total You Will Give</h3>
                <div id="total-give" class="amount text-red">₹0</div>
            </div>
            <div class="card">
                <h3>Net Balance</h3>
                <div id="net-balance" class="amount">₹0</div>
            </div>
        </div>

        <div class="main-content">
            
            <!-- Left Panel: Customers & Events -->
            <div class="panel">
                <h2>Customers & Events</h2>
                <div class="form-group">
                    <input type="text" id="cust-name" placeholder="Name (e.g. Rahul or Wedding)">
                </div>
                
                <div class="form-group">
                    <label for="cust-type">Category Type:</label>
                    <select id="cust-type">
                        <option value="Customer">👤 Customer</option>
                        <option value="Event">🎉 Event / Trip</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="addCustomer()">+ Add Entry</button>

                <ul class="customer-list" id="customer-list" style="margin-top: 15px;">
                    <!-- Dynamic List -->
                </ul>

                <button class="btn btn-export" onclick="exportFullSummaryPDF()">📄 Export Summary PDF</button>
            </div>

            <!-- Right Panel: Transactions -->
            <div class="panel">
                <div class="header-action">
                    <h2 id="current-cust-title">Select an item to view transactions</h2>
                    <button id="export-cust-pdf-btn" class="btn btn-pdf" style="display: none;" onclick="exportCustomerPDF()">📥 Statement PDF</button>
                </div>
                
                <div id="transaction-form" style="display: none;">
                    <div class="form-group">
                        <label for="tx-date">Transaction Date:</label>
                        <input type="date" id="tx-date" min="2000-01-01" max="2030-12-31">
                    </div>

                    <div class="form-group">
                        <input type="number" id="tx-amount" placeholder="Amount (₹)">
                    </div>
                    <div class="form-group">
                        <input type="text" id="tx-note" placeholder="Description / Remarks (optional)">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-gave" onclick="addTransaction('gave')">You Gave ₹</button>
                        <button class="btn btn-got" onclick="addTransaction('got')">You Got ₹</button>
                    </div>
                    <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border);">
                </div>

                <!-- Transaction History -->
                <h3>Transaction Ledger</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date (DD/MM/YYYY)</th>
                            <th>Details</th>
                            <th>You Gave</th>
                            <th>You Got</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tx-history">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        let currentUser = null;
        let customers = [];
        let transactions = [];
        let selectedCustomerId = null;

        // Date Format Helper: YYYY-MM-DD -> DD/MM/YYYY
        function formatDateToDMY(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateString;
        }

        // Today's Date in DD/MM/YYYY
        function getTodayDMY() {
            const today = new Date();
            const d = String(today.getDate()).padStart(2, '0');
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const y = today.getFullYear();
            return `${d}/${m}/${y}`;
        }

        // AUTHENTICATION LOGIC
        function switchAuthTab(tab) {
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            let users = JSON.parse(localStorage.getItem('lf_users')) || {};

            if (users[username]) {
                alert('Username already exists!');
                return;
            }

            users[username] = { password: password };
            localStorage.setItem('lf_users', JSON.stringify(users));

            alert('Account created successfully! Please log in.');
            switchAuthTab('login');
            document.getElementById('login-username').value = username;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            let users = JSON.parse(localStorage.getItem('lf_users')) || {};

            if (!users[username] || users[username].password !== password) {
                alert('Invalid username or password!');
                return;
            }

            currentUser = username;
            localStorage.setItem('lf_active_user', username);
            startApp();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('lf_active_user');
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('login-form').reset();
            document.getElementById('register-form').reset();
        }

        function startApp() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('logged-user-name').innerText = currentUser;

            loadUserData();
            loadTitle();
            setDefaultDate();
            renderCustomers();
            updateDashboard();
        }

        function loadUserData() {
            customers = JSON.parse(localStorage.getItem(`lf_${currentUser}_customers`)) || [];
            transactions = JSON.parse(localStorage.getItem(`lf_${currentUser}_transactions`)) || [];
        }

        function saveData() {
            localStorage.setItem(`lf_${currentUser}_customers`, JSON.stringify(customers));
            localStorage.setItem(`lf_${currentUser}_transactions`, JSON.stringify(transactions));
            updateDashboard();
        }

        function saveTitle() {
            const titleElem = document.getElementById('app-title');
            localStorage.setItem(`lf_${currentUser}_title`, titleElem.innerText);
        }

        function loadTitle() {
            const savedTitle = localStorage.getItem(`lf_${currentUser}_title`);
            document.getElementById('app-title').innerText = savedTitle || '⚡ LedgerFlow';
        }

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('tx-date');
            if (today >= '2000-01-01' && today <= '2030-12-31') {
                dateInput.value = today;
            } else {
                dateInput.value = '2026-01-01';
            }
        }

        function addCustomer() {
            const nameInput = document.getElementById('cust-name');
            const typeInput = document.getElementById('cust-type');
            const name = nameInput.value.trim();
            const type = typeInput.value;

            if (!name) {
                alert('Please enter a name!');
                return;
            }

            const newCust = { id: Date.now(), name: name, category: type };
            customers.push(newCust);
            saveData();
            renderCustomers();
            nameInput.value = '';
            selectCustomer(newCust.id);
        }

        function deleteCustomer(id, event) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this entry and all its transactions?")) return;

            customers = customers.filter(c => c.id !== id);
            transactions = transactions.filter(t => t.customerId !== id);

            if (selectedCustomerId === id) {
                selectedCustomerId = null;
                document.getElementById('current-cust-title').innerText = "Select an item to view transactions";
                document.getElementById('transaction-form').style.display = 'none';
                document.getElementById('export-cust-pdf-btn').style.display = 'none';
                document.getElementById('tx-history').innerHTML = '';
            }

            saveData();
            renderCustomers();
        }

        function renderCustomers() {
            const list = document.getElementById('customer-list');
            list.innerHTML = '';

            customers.forEach(cust => {
                const li = document.createElement('li');
                li.className = `customer-item ${cust.id === selectedCustomerId ? 'active' : ''}`;
                li.onclick = () => selectCustomer(cust.id);
                
                const custBalance = getCustomerBalance(cust.id);
                let balClass = custBalance >= 0 ? 'text-green' : 'text-red';
                const badgeClass = cust.category === 'Event' ? 'badge-event' : 'badge-cust';

                li.innerHTML = `
                    <div>
                        <span>${cust.name}</span>
                        <span class="badge ${badgeClass}">${cust.category || 'Customer'}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="${balClass}">₹${Math.abs(custBalance)}</span>
                        <button class="delete-btn" title="Delete" onclick="deleteCustomer(${cust.id}, event)">🗑️</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function selectCustomer(id) {
            selectedCustomerId = id;
            const cust = customers.find(c => c.id === id);
            
            document.getElementById('current-cust-title').innerText = `Statement: ${cust.name}`;
            document.getElementById('transaction-form').style.display = 'block';
            document.getElementById('export-cust-pdf-btn').style.display = 'inline-flex';

            renderCustomers();
            renderTransactions();
        }

        function addTransaction(type) {
            const amountInput = document.getElementById('tx-amount');
            const noteInput = document.getElementById('tx-note');
            const dateInput = document.getElementById('tx-date');

            const amount = parseFloat(amountInput.value);
            const note = noteInput.value.trim() || (type === 'gave' ? 'You Gave' : 'You Got');
            const selectedDate = dateInput.value;

            if (!selectedDate || selectedDate < '2000-01-01' || selectedDate > '2030-12-31') {
                alert('Please select a valid date.');
                return;
            }

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }

            const newTx = {
                id: Date.now(),
                customerId: selectedCustomerId,
                type: type,
                amount: amount,
                note: note,
                date: selectedDate
            };

            transactions.push(newTx);
            saveData();
            renderTransactions();
            renderCustomers();

            amountInput.value = '';
            noteInput.value = '';
        }

        function renderTransactions() {
            const tbody = document.getElementById('tx-history');
            tbody.innerHTML = '';

            const custTx = transactions.filter(t => t.customerId === selectedCustomerId);

            if (custTx.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">No transaction records found.</td></tr>';
                return;
            }

            custTx.sort((a, b) => new Date(b.date) - new Date(a.date));

            custTx.forEach((tx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${formatDateToDMY(tx.date)}</td>
                    <td>${tx.note}</td>
                    <td class="text-red">${tx.type === 'gave' ? '₹' + tx.amount : '-'}</td>
                    <td class="text-green">${tx.type === 'got' ? '₹' + tx.amount : '-'}</td>
                    <td><button class="delete-btn" onclick="deleteTransaction(${tx.id})">Remove</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteTransaction(txId) {
            transactions = transactions.filter(t => t.id !== txId);
            saveData();
            renderTransactions();
            renderCustomers();
        }

        function getCustomerBalance(custValId) {
            const custTx = transactions.filter(t => t.customerId === custValId);
            return custTx.reduce((acc, tx) => tx.type === 'gave' ? acc + tx.amount : acc - tx.amount, 0);
        }

        function updateDashboard() {
            let totalGet = 0, totalGive = 0;

            customers.forEach(cust => {
                const bal = getCustomerBalance(cust.id);
                if (bal > 0) totalGet += bal;
                else totalGive += Math.abs(bal);
            });

            document.getElementById('total-get').innerText = `₹${totalGet}`;
            document.getElementById('total-give').innerText = `₹${totalGive}`;

            const net = totalGet - totalGive;
            const netElem = document.getElementById('net-balance');
            netElem.innerText = `₹${Math.abs(net)} ${net >= 0 ? '(Get)' : '(Pay)'}`;
            netElem.className = `amount ${net >= 0 ? 'text-green' : 'text-red'}`;
        }

        // IMAGE-MATCHING PDF STATEMENT EXPORT
        function exportCustomerPDF() {
            if (!selectedCustomerId) return;
            const cust = customers.find(c => c.id === selectedCustomerId);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const balance = getCustomerBalance(cust.id);
            const custTx = transactions.filter(t => t.customerId === selectedCustomerId);
            custTx.sort((a, b) => new Date(a.date) - new Date(b.date));

            const appTitle = document.getElementById('app-title').innerText;
            const generatedDate = getTodayDMY();

            // 1. Centered Editable Heading
            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(59, 130, 246);
            doc.text(appTitle, 105, 22, { align: "center" });

            // 2. Subtitle
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.setTextColor(100, 116, 139);
            doc.text(`Digital Account Statement - Account: ${currentUser}`, 105, 28, { align: "center" });

            // 3. Info Block
            doc.setFontSize(10);
            doc.setTextColor(30, 41, 59);

            // Name (replaces Customer Name)
            doc.setFont("helvetica", "normal");
            doc.text("Name: ", 14, 42);
            doc.setFont("helvetica", "bold");
            doc.text(`${cust.name}`, 30, 42);

            // Generated Date in DD/MM/YYYY
            doc.setFont("helvetica", "normal");
            doc.text("Generated Date: ", 14, 48);
            doc.setFont("helvetica", "bold");
            doc.text(`${generatedDate}`, 46, 48);

            // Net Balance
            doc.setFont("helvetica", "normal");
            doc.text("Net Balance: ", 14, 54);
            doc.setFont("helvetica", "bold");
            const netStatus = balance >= 0 ? `You Get Rs. ${balance}` : `You Give Rs. ${Math.abs(balance)}`;
            doc.setTextColor(balance >= 0 ? 16 : 239, balance >= 0 ? 185 : 68, balance >= 0 ? 129 : 68);
            doc.text(netStatus, 40, 54);

            // 4. Columns: Date, Details, You Gave, You Got
            const tableRows = custTx.map(tx => [
                formatDateToDMY(tx.date),
                tx.note,
                tx.type === 'gave' ? `Rs. ${tx.amount}` : '-',
                tx.type === 'got' ? `Rs. ${tx.amount}` : '-'
            ]);

            doc.autoTable({
                startY: 60,
                head: [['Date', 'Details', 'You Gave', 'You Got']],
                body: tableRows,
                headStyles: { 
                    fillColor: [37, 99, 235], 
                    textColor: [255, 255, 255], 
                    fontStyle: 'bold',
                    fontSize: 9
                },
                alternateRowStyles: { fillColor: [255, 255, 255] },
                styles: { fontSize: 8.5, cellPadding: 3, textColor: [30, 41, 59] },
                columnStyles: {
                    0: { cellWidth: 35 },
                    1: { cellWidth: 'auto' },
                    2: { cellWidth: 35, textColor: [239, 68, 68] },
                    3: { cellWidth: 35, textColor: [16, 185, 129] }
                }
            });

            // 5. Footer Contact
            const pageHeight = doc.internal.pageSize.height;
            doc.setFontSize(8);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(148, 163, 184);
            doc.text(`For Help contact ${currentUser}`, 105, pageHeight - 15, { align: "center" });

            doc.save(`${cust.name}_Statement.pdf`);
        }

        // OVERALL SUMMARY PDF EXPORT
        function exportFullSummaryPDF() {
            if (customers.length === 0) {
                alert("No records to export!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const appTitle = document.getElementById('app-title').innerText;
            const generatedDate = getTodayDMY();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(59, 130, 246);
            doc.text(`${appTitle} Summary`, 105, 22, { align: "center" });

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`User: ${currentUser} | Generated Date: ${generatedDate}`, 105, 30, { align: "center" });

            let totalGet = 0, totalGive = 0;
            const tableRows = customers.map((cust) => {
                const bal = getCustomerBalance(cust.id);
                if (bal > 0) totalGet += bal;
                else totalGive += Math.abs(bal);
                return [cust.name, cust.category || 'Customer', bal >= 0 ? 'You Get' : 'You Give', `Rs. ${Math.abs(bal)}`];
            });

            doc.autoTable({
                startY: 40,
                head: [['Name', 'Category', 'Status', 'Net Balance']],
                body: tableRows,
                headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255], fontStyle: 'bold' },
                styles: { fontSize: 9, cellPadding: 3.5 }
            });

            doc.save(`Ledger_Overall_Summary.pdf`);
        }

        // Initialize App Session
        window.onload = function() {
            const activeUser = localStorage.getItem('lf_active_user');
            if (activeUser) {
                currentUser = activeUser;
                startApp();
            }
        };
    </script>
</body>
</html>
